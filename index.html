
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Web App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            width: 400px;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 32px;
        }

        p {
            margin-bottom: 20px;
            font-size: 18px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: #ff9800;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: #e68900;
            transform: scale(1.05);
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dockerized Web App</h1>
        <p>HTML + CSS + JavaScript running inside Docker</p>

        <button onclick="showMessage()">Click Me</button>

        <div id="message"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById('message').innerText =
                'Application is running successfully inside Docker 🚀';
        }
    </script>

</body>
</html>
